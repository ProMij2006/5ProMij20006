<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4 p-4">
                    <h2 class="card-title text-center mb-4 text-primary fw-bold">Калькулятор заказа</h2>

                    
                    <div class="mb-3">
                        <label for="productSelect" class="form-label fw-semibold">Выберите товар:</label>
                        <select id="productSelect" class="form-select">
                            <option value="120000">Iphone 18 — 120 000 руб.</option>
                            <option value="100000">Samsung Galxy S26 — 100 000 руб.</option>
                            <option value="70000">Xiaomi MI6 — 70 000 руб.</option>
                        </select>
                    </div>

                    
                    <div class="mb-3">
                        <label for="quantityInput" class="form-label fw-semibold">Количество:</label>
                        <input type="text" id="quantityInput" class="form-control" value="1">
                        <div id="error" class="invalid-feedback"></div>
                    </div>

                    
                    <button id="calcBtn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Рассчитать</button>

                    
                    <div id="result" class="mt-3 fw-bold text-success text-center"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
