<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator-card">
        <h2>Калькулятор заказа</h2>

        
        <div class="form-group">
            <label for="productSelect">Выберите товар:</label>
            <select id="productSelect">
                <option value="120000">Iphone 18 — 120 000 руб.</option>
                <option value="100000">Samsung Galxy S26 — 100 000 руб.</option>
                <option value="70000">Xiaomi MI6 — 70 000 руб.</option>
            </select>
        </div>

        
        <div class="form-group">
            <label for="quantityInput">Количество:</label>
            <input type="text" id="quantityInput" value="1">
            <div id="error" class="error-message"></div>
        </div>

        
        <button id="calcBtn">Рассчитать</button>

        
        <div id="result" class="result-message"></div>
    </div>

</body>
</html>
